<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 646" width="1240" height="646" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A867E"/>
    </marker>
  </defs>

  <rect width="1240" height="646" fill="#FBFAF9"/>

  <text x="24" y="34" font-size="17" font-weight="600" fill="#1F1E1C">CitiBike Lakehouse — architecture</text>
  <text x="24" y="54" font-size="12" fill="#6B6862">One source, two ingestion paths: incremental with Structured Streaming, batch historised as SCD2.</text>

  <text x="24"   y="92" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">SOURCE</text>
  <text x="24"   y="108" font-size="10" fill="#8A867E">GBFS REST API</text>
  <text x="208"  y="92" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">LANDING</text>
  <text x="208"  y="108" font-size="10" fill="#8A867E">Python · UC Volume</text>
  <text x="392"  y="92" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">BRONZE</text>
  <text x="392"  y="108" font-size="10" fill="#8A867E">PySpark</text>
  <text x="592"  y="92" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">SILVER</text>
  <text x="592"  y="108" font-size="10" fill="#8A867E">dbt</text>
  <text x="812"  y="92" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">GOLD</text>
  <text x="812"  y="108" font-size="10" fill="#8A867E">dbt · star schema</text>
  <text x="1052" y="92" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">SERVING</text>
  <text x="1052" y="108" font-size="10" fill="#8A867E">Databricks SQL</text>

  <rect x="16"  y="128" width="772" height="168" rx="10" fill="#EAF4F2"/>
  <rect x="16"  y="376" width="772" height="168" rx="10" fill="#FAF0E2"/>
  <rect x="804" y="128" width="216" height="416" rx="10" fill="#EDF0FB"/>

  <text x="30" y="148" font-size="10" font-weight="600" fill="#0F766E" letter-spacing="0.8">INCREMENTAL — every hour</text>
  <text x="30" y="396" font-size="10" font-weight="600" fill="#B45309" letter-spacing="0.8">BATCH — daily 05:00 UTC</text>

  <!-- STREAM LANE -->
  <rect x="24" y="164" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#B7D8D2"/>
  <text x="36" y="187" font-size="11.5" font-weight="600" fill="#1F1E1C">station_status</text>
  <text x="36" y="204" font-size="10" fill="#6B6862">changes every ~10s</text>

  <rect x="208" y="164" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#B7D8D2"/>
  <text x="220" y="187" font-size="11" font-weight="600" fill="#1F1E1C">/landing/status/</text>
  <text x="220" y="204" font-size="10" fill="#6B6862">raw JSON, by date</text>

  <rect x="392" y="164" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#B7D8D2"/>
  <text x="404" y="187" font-size="11" font-weight="600" fill="#1F1E1C">station_status_raw</text>
  <text x="404" y="204" font-size="10" fill="#6B6862">Auto Loader · checkpoint</text>

  <rect x="592" y="146" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#B7D8D2"/>
  <text x="604" y="167" font-size="11" font-weight="600" fill="#1F1E1C">silver_station_status</text>
  <text x="604" y="183" font-size="10" fill="#6B6862">incremental · MERGE</text>

  <rect x="592" y="212" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#B7D8D2"/>
  <text x="604" y="233" font-size="11" font-weight="600" fill="#1F1E1C">silver_station_events</text>
  <text x="604" y="249" font-size="10" fill="#6B6862">streaming table · 2h</text>

  <!-- BATCH LANE -->
  <rect x="24" y="412" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#EBCF9E"/>
  <text x="36" y="435" font-size="10.5" font-weight="600" fill="#1F1E1C">station_information</text>
  <text x="36" y="452" font-size="10.5" font-weight="600" fill="#1F1E1C">system_regions</text>

  <rect x="208" y="412" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#EBCF9E"/>
  <text x="220" y="435" font-size="11" font-weight="600" fill="#1F1E1C">/landing/catalog/</text>
  <text x="220" y="452" font-size="10" fill="#6B6862">full snapshot</text>

  <rect x="392" y="404" width="160" height="72" rx="6" fill="#FFFFFF" stroke="#EBCF9E"/>
  <text x="404" y="425" font-size="10.5" font-weight="600" fill="#1F1E1C">station_information_raw</text>
  <text x="404" y="442" font-size="10.5" font-weight="600" fill="#1F1E1C">system_regions_raw</text>
  <text x="404" y="461" font-size="10" fill="#6B6862">overwrite · no state</text>

  <rect x="592" y="412" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#EBCF9E"/>
  <text x="604" y="435" font-size="11" font-weight="600" fill="#1F1E1C">snapshot_station</text>
  <text x="604" y="452" font-size="10" fill="#6B6862">SCD2 · check strategy</text>

  <!-- GOLD -->
  <rect x="820" y="152" width="184" height="44" rx="6" fill="#FFFFFF" stroke="#BFCBEE"/>
  <text x="832" y="171" font-size="11" font-weight="600" fill="#1F1E1C">dim_station</text>
  <text x="832" y="186" font-size="10" fill="#6B6862">surrogate key · unknown member</text>

  <rect x="820" y="212" width="184" height="44" rx="6" fill="#FFFFFF" stroke="#BFCBEE"/>
  <text x="832" y="231" font-size="11" font-weight="600" fill="#1F1E1C">dim_region</text>
  <text x="832" y="246" font-size="10" fill="#6B6862">7 boroughs + unknown</text>

  <rect x="820" y="272" width="184" height="44" rx="6" fill="#FFFFFF" stroke="#8FA4DD" stroke-width="1.6"/>
  <text x="832" y="291" font-size="11" font-weight="600" fill="#1F1E1C">fct_station_availability</text>
  <text x="832" y="306" font-size="10" fill="#6B6862">temporal join on valid_from/to</text>

  <rect x="820" y="332" width="184" height="44" rx="6" fill="#FFFFFF" stroke="#BFCBEE"/>
  <text x="832" y="351" font-size="11" font-weight="600" fill="#1F1E1C">agg_system_hourly</text>
  <text x="832" y="366" font-size="10" fill="#6B6862">occupancy by region × hour</text>

  <rect x="820" y="392" width="184" height="44" rx="6" fill="#FFFFFF" stroke="#BFCBEE"/>
  <text x="832" y="411" font-size="11" font-weight="600" fill="#1F1E1C">mart_station_health</text>
  <text x="832" y="426" font-size="10" fill="#6B6862">chronic vs episodic failure</text>

  <text x="832" y="474" font-size="10" fill="#6B6862">43 dbt tests run over this layer</text>
  <text x="832" y="490" font-size="10" fill="#6B6862">on every build.</text>

  <!-- SERVING -->
  <rect x="1052" y="212" width="164" height="52" rx="6" fill="#FFFFFF" stroke="#D6D2CA"/>
  <text x="1064" y="234" font-size="11" font-weight="600" fill="#1F1E1C">AI/BI Dashboard</text>
  <text x="1064" y="250" font-size="10" fill="#6B6862">map · series · rankings</text>

  <rect x="1052" y="332" width="164" height="52" rx="6" fill="#FFFFFF" stroke="#D6D2CA"/>
  <text x="1064" y="354" font-size="11" font-weight="600" fill="#1F1E1C">Genie</text>
  <text x="1064" y="370" font-size="10" fill="#6B6862">natural-language queries</text>

  <!-- ARROWS: column to column -->
  <g stroke="#8A867E" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M 170 192 L 204 192"/>
    <path d="M 354 192 L 388 192"/>
    <path d="M 554 192 L 388 192" stroke="none"/>
    <path d="M 554 192 L 588 192"/>
    <path d="M 170 440 L 204 440"/>
    <path d="M 354 440 L 388 440"/>
    <path d="M 554 440 L 588 440"/>
    <path d="M 790 300 L 812 300"/>
    <path d="M 1006 238 L 1048 238"/>
    <path d="M 1006 358 L 1048 358"/>
  </g>

  <!-- ARROWS: silver collector bus into gold -->
  <g stroke="#8A867E" stroke-width="1.4" fill="none">
    <path d="M 774 171 H 790"/>
    <path d="M 774 237 H 790"/>
    <path d="M 774 440 H 790"/>
    <path d="M 790 171 V 512"/>
    <path d="M 472 480 V 512 H 790" stroke-dasharray="4 3"/>
  </g>
  <circle cx="790" cy="300" r="2.6" fill="#8A867E"/>
  <text x="486" y="530" font-size="9.5" fill="#9A968E">system_regions skips silver — 7 static rows, no history to keep</text>

  <!-- FOOTER -->
  <rect x="16" y="562" width="1200" height="66" rx="10" fill="#F4F2EE" stroke="#DEDAD2"/>
  <text x="32" y="586" font-size="11" font-weight="600" fill="#1F1E1C" letter-spacing="0.6">ORCHESTRATION &amp; QUALITY</text>
  <text x="32" y="608" font-size="10.5" fill="#4A4741">Databricks Workflows runs both jobs on schedule · dbt source freshness gates the build · GitHub Actions builds every PR into ci_ schemas</text>
  <text x="32" y="622" font-size="10.5" fill="#4A4741">· a Databricks SQL alert fires if bronze goes 90 minutes without a capture</text>
</svg>
